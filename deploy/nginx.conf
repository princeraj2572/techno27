# /etc/nginx/sites-available/techno27  — replace YOUR_DOMAIN everywhere (see DEPLOYMENT_AWS.md step 6).
# Written for the Nginx 1.24 that ships with Ubuntu 24.04.
# Nginx terminates HTTPS, serves user uploads straight from disk, and proxies everything else to Next.js on 127.0.0.1:3000.

upstream techno27_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot's HTTP-01 challenge; everything else goes to HTTPS once the certificate exists.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # From `certbot certonly --webroot` (guide step 6.1); enable this file only after they exist.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Profile photos are capped at 2 MB by the app; small headroom for multipart overhead.
    client_max_body_size 3m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # User uploads live OUTSIDE the app folder so redeploys don't wipe them, and `next start` only serves
    # files that existed in /public at build time. Serve only image extensions, never as HTML/scripts.
    location ^~ /uploads/ {
        alias /var/www/techno27-uploads/;
        location ~* \.(jpe?g|png|webp)$ {
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'" always;
            expires 30d;
            try_files $uri =404;
        }
        return 404;  # anything that isn't an image (e.g. an uploaded .html) is never served
    }

    # /_next/static/* already gets "immutable, 1 year" Cache-Control from Next.js itself.
    location / {
        proxy_pass http://techno27_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
